name: Daily Transaction Reminder Dispatcher

on:
  schedule:
    # Runs every 15 minutes (UTC) to check if any user's daily reminder is due
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allows manual test trigger from GitHub Actions tab

jobs:
  dispatch-reminders:
    name: Check and Dispatch Daily Transaction Reminders
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Reminder Dispatcher
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://www.rovabusiness.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Pinging ROVA reminder dispatcher endpoint at ${APP_URL}..."
          RESPONSE=$(curl -s -L --max-time 30 -w "\nHTTP_STATUS:%{http_code}" \
            "${APP_URL}/api/reminder-push?action=cron_check" \
            -H "User-Agent: GitHub-Actions-Cron/1.0" \
            -H "Authorization: Bearer ${CRON_SECRET}" || true)
          
          echo "Dispatcher Response:"
          echo "$RESPONSE"
